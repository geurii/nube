name: Diagnostico

# Prueba REAL y corta (1-2 minutos): llama a cada proveedor de IA con las claves reales y guarda lo que contestan en oficina-salida/diagnostico.json.
on:
  push:
    paths:
      - 'agentes/diagnostico.disparo'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Llamar a los proveedores
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node agentes/diagnostico.mjs
          node agentes/probar-json-groq.mjs
      - name: Guardar resultado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-proveedores
          path: oficina-salida/diagnostico.json
          if-no-files-found: warn
          retention-days: 7
