name: Brayant - generar escenas
# Rama brayant-3d. No publica en redes ni toca la cola de Lo Que No Sabias.
on:
  push:
    branches: [brayant-3d]
    paths: ['brayant-3d/gen/lanzar.json', 'brayant-3d/gen/generar.py', '.github/workflows/brayant-gen.yml']
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-24.04
    outputs:
      escenas: ${{ steps.l.outputs.escenas }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "escenas=$(jq -c . brayant-3d/gen/lanzar.json)" >> "$GITHUB_OUTPUT"
  generar:
    needs: lista
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        escena: ${{ fromJson(needs.lista.outputs.escenas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas
        run: |
          pip install --quiet --no-cache-dir torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --no-cache-dir diffusers==0.35.1 transformers==4.55.4 accelerate==1.10.0 safetensors sentencepiece protobuf imageio==2.37.0 imageio-ffmpeg==0.6.0 pillow
      - name: Generar la escena
        env:
          HF_HOME: ${{ runner.temp }}/modelos-hf
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p "$HF_HOME"
          df -h "$HF_HOME"; free -g
          python brayant-3d/gen/generar.py "${{ matrix.escena }}"
          test -s "escena${{ matrix.escena }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: escena-${{ matrix.escena }}
          path: escena*.mp4
      - name: Guardar el clip en la rama
        run: |
          mkdir -p brayant-3d/gen/salida
          cp "escena${{ matrix.escena }}.mp4" brayant-3d/gen/salida/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f "brayant-3d/gen/salida/escena${{ matrix.escena }}.mp4"
          git commit -m "Brayant: escena ${{ matrix.escena }}"
          for i in 1 2 3 4 5 6; do git pull --rebase origin brayant-3d && git push && exit 0; sleep $((i*7)); done
          exit 1
