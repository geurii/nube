name: Lote 30 - publicar cada dos horas
on:
  workflow_dispatch:
    inputs:
      activar:
        description: 'Escribe SI para encender la cola de los 30 (solo la primera vez).'
        required: false
        default: 'no'
  # Arranca cuando una persona sube el estado de la cola (los guardados del propio robot no disparan esto).
  push:
    branches: [main]
    paths: ['agentes/lote-30-publicacion.json']
  # Respaldo: si la cadena se corta, GitHub la vuelve a despertar sola.
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: publicar-lote-30
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # ref: main para leer siempre el estado más reciente y no repetir videos.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Encender la cola
        if: github.event.inputs.activar == 'SI'
        run: |
          node scripts/publicar-lote-30.mjs --activate
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add agentes/lote-30-publicacion.json
          git diff --cached --quiet || git commit -m "Lote 30: cola encendida"
          git pull --rebase -X theirs origin main
          git push
      - name: Comprobar la cola y el reloj de dos horas
        id: cola
        run: node scripts/publicar-lote-30.mjs --prepare
      # Espera la hora y vuelve a leer el estado, por si cambió mientras esperaba.
      - name: Esperar la hora del siguiente video
        if: steps.cola.outputs.enabled == 'true'
        run: |
          node scripts/publicar-lote-30.mjs --wait
          git pull --rebase origin main
      - name: Preparar ffprobe para verificar y publicar
        if: steps.cola.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      # El artefacto short-N trae el video Y su guion (título y descripción).
      - name: Descargar el Short que toca
        if: steps.cola.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: short-${{ steps.cola.outputs.index }}
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.cola.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprobar que están el video y el guion correctos
        if: steps.cola.outputs.enabled == 'true'
        env:
          ID: ${{ steps.cola.outputs.id }}
        run: |
          test -s "out/serie/$ID-subida.mp4" || { echo "Falta el video de $ID"; exit 1; }
          test -s "guion/serie/$ID.json" || { echo "Falta el guion de $ID"; exit 1; }
      - name: Reservar el video para no subirlo dos veces
        id: reserva
        if: steps.cola.outputs.enabled == 'true'
        env:
          ID: ${{ steps.cola.outputs.id }}
          LOTE_INDEX: ${{ steps.cola.outputs.index }}
        run: |
          node scripts/publicar-lote-30.mjs --reserve
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add agentes/lote-30-publicacion.json
          git commit -m "Lote 30: reservar $ID"
          git pull --rebase --autostash -X theirs origin main
          git push
      - name: Publicar un solo Short en YouTube, Facebook, Instagram y TikTok
        if: steps.reserva.outcome == 'success'
        continue-on-error: true
        env:
          ID: ${{ steps.cola.outputs.id }}
          CANAL: lqns
          PUBLICACION_LOTE: '1'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_CANAL: ${{ secrets.YT_REFRESH_TOKEN_LQNS }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FB_VIDEOS_TOKEN: ${{ secrets.FB_VIDEOS_TOKEN }}
        run: |
          set +e
          cp "out/serie/$ID-subida.mp4" "out/serie/$ID.mp4"
          node agentes/subir.mjs
          YT_RC=$?
          node agentes/facebook.mjs
          REDES_RC=$?
          echo "Resultado técnico: YouTube=$YT_RC; redes=$REDES_RC."
          exit 0
      - name: Anotar el resultado y pasar al siguiente
        if: always() && steps.reserva.outcome == 'success'
        env:
          ID: ${{ steps.cola.outputs.id }}
          LOTE_INDEX: ${{ steps.cola.outputs.index }}
        run: node scripts/publicar-lote-30.mjs --finalize
      # Se guarda ANTES de llamar al siguiente.
      - name: Guardar registros y estado de la cola
        if: always() && steps.reserva.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A agentes/lote-30-publicacion.json oficina-salida/lqns
          git diff --cached --quiet || git commit -m "Lote 30: guardar confirmaciones y progreso de publicación"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 15
          done
          exit 1
      - name: Activar el siguiente Short
        if: always() && steps.reserva.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fase=$(node -p 'require("./agentes/lote-30-publicacion.json").fase')
          if [ "$fase" != "ready_to_publish" ]; then echo "Cola terminada o pausada."; exit 0; fi
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publicar-lote-30.yml/dispatches" \
            -d '{"ref":"main"}'
