name: Lote 30 - publicar cada veinte minutos
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publicar-lote-30
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar barrera 30 de 30 y reloj de veinte minutos
        id: cola
        run: node scripts/publicar-lote-30.mjs --prepare
      - name: Preparar ffprobe para verificar y publicar
        if: steps.cola.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Descargar el artefacto del render de los 30 Shorts
        if: steps.cola.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cola.outputs.artifact }}
          path: out/serie
          repository: ${{ github.repository }}
          run-id: ${{ steps.cola.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar un solo Short en YouTube, Facebook, Instagram y TikTok
        if: always() && steps.cola.outputs.enabled == 'true'
        continue-on-error: true
        env:
          ID: ${{ steps.cola.outputs.id }}
          CANAL: lqns
          PUBLICACION_LOTE: '1'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_CANAL: ${{ secrets.YT_REFRESH_TOKEN_LQNS }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FB_VIDEOS_TOKEN: ${{ secrets.FB_VIDEOS_TOKEN }}
        run: |
          set +e
          test -s "out/serie/$ID-subida.mp4"
          if [ "$?" -ne 0 ]; then echo "No se descargó el MP4 optimizado."; exit 1; fi
          cp "out/serie/$ID-subida.mp4" "out/serie/$ID.mp4"
          node agentes/subir.mjs
          YT_RC=$?
          node agentes/facebook.mjs
          REDES_RC=$?
          echo "Resultado técnico: YouTube=$YT_RC; redes=$REDES_RC. La cola solo avanza si las cuatro plataformas confirman."
          exit 0
      - name: Confirmar redes y mover el puntero solo si todo salió bien
        if: always() && steps.cola.outputs.enabled == 'true'
        env:
          ID: ${{ steps.cola.outputs.id }}
          LOTE_INDEX: ${{ steps.cola.outputs.index }}
        run: node scripts/publicar-lote-30.mjs --finalize
      - name: Esperar veinte minutos y activar el siguiente Short
        if: success() && steps.cola.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          listo=$(node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("agentes/lote-30-publicacion.json","utf8")); process.stdout.write(x.fase==="ready_to_publish" && Number(x.nextIndex)<30 ? "si" : "no");')
          if [ "$listo" != "si" ]; then echo "Cola completa o bloqueada; no se encadena otro Short."; exit 0; fi
          sleep 1200
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publicar-lote-30.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Guardar registros y estado de la cola
        if: always() && steps.cola.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A agentes/lote-30-publicacion.json oficina-salida/lqns
          git diff --cached --quiet || git commit -m "Lote 30: guardar confirmaciones y progreso de publicación"
          git pull --rebase --autostash -X theirs origin main
          git push
