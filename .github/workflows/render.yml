name: Render videos

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        id: [forbes-s1, forbes-s2, forbes-s3, forbes-largo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias del sistema (Chrome de Remotion y ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - run: npm install --no-audit --no-fund
      - name: Renderizar este video (cada video corre en su propia máquina, en paralelo)
        run: npm run lote -- ${{ matrix.id }} --forzar
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.id }}
          path: out/serie/*.mp4
          retention-days: 7
