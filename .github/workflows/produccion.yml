name: Produccion

# DespuÃ©s de cada corrida de la Oficina: toma el guion aprobado, graba la voz, renderiza el video y (si hay claves) lo sube como privado a YouTube.
on:
  workflow_run:
    workflows:
      - Oficina
    types:
      - completed
  push:
    paths:
      - 'agentes/produccion.disparo'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  producir:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        with:
          node-version: 22
      - name: Dependencias del sistema (Chrome de Remotion y ffmpeg)
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: npm install --no-audit --no-fund
      - name: Voz (msedge-tts solo para este flujo)
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: npm install --no-save --no-audit --no-fund msedge-tts@2.1.1
      - name: Marcar inicio de producciÃ³n
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          node agentes/progreso.mjs 40 "Grabando la voz y renderizando el video" || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: Grabando la voz y renderizando el video"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done
      - name: Producir el video
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        id: producir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node agentes/producir.mjs
      - name: Seleccionar destino de publicación
        id: destino
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          destino=$(node -e "try { const x=require('./agentes/publicacion.json'); process.stdout.write(x.destino || 'ambos'); } catch { process.stdout.write('ambos'); }")
          case "$destino" in tiktok|youtube|ambos) ;; *) echo "Destino inválido: $destino"; exit 1;; esac
          echo "valor=$destino" >> "$GITHUB_OUTPUT"
          echo "Destino de este video: $destino"
      - name: Autopsia (por quÃ© los videos anteriores no cogieron vistas)
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node agentes/vistas.mjs && node agentes/autopsia.mjs
      - name: 'Revision tecnica del video (Gemini: imagen, audio y subtitulos)'
        id: panel
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --check agentes/video-gemini.mjs
          node --check agentes/panel.mjs
          node agentes/panel.mjs
      - name: Ayuda mutua (los puestos libres hacen otras tareas)
        if: ${{ steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: timeout 240 node agentes/ayuda.mjs; timeout 240 node agentes/funciones.mjs; timeout 240 node agentes/conciencia.mjs
      - name: Marcar progreso tras la revision tecnica
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          node agentes/progreso.mjs 90 'Revision tecnica lista - listo para subir' || true
      - name: Guardar el avance en el repositorio
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git add guion/serie 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Produccion: avance automatico"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push && break
            echo "No pude guardar (intento $i); reintento en 5 s"
            sleep 5
          done
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then echo "ERROR: no se pudo subir el resultado al repositorio"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        with:
          name: video-${{ steps.producir.outputs.id }}
          path: out/serie/*.mp4
          retention-days: 14
      - name: Subir a YouTube (publicaciÃ³n automÃ¡tica si hay credenciales)
        id: subir
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.panel.outputs.aprobado == 'true' && steps.destino.outputs.valor != 'tiktok' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_CANAL: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', steps.producir.outputs.canal)] }}
        run: |
          node agentes/subir.mjs
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Publicador: resultado de la subida"
          git pull --rebase --autostash -X theirs origin main && git push || true
      - name: Publicar en Facebook, Instagram y TikTok (Windsor y Buffer; solo si hay claves; nunca falla el ciclo)
        id: redes
        if: ${{ steps.producir.outputs.id != '' && steps.panel.outputs.aprobado == 'true' && steps.destino.outputs.valor != 'youtube' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          FB_VIDEOS_TOKEN: ${{ secrets.FB_VIDEOS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node agentes/facebook.mjs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Publicador: resultado de Facebook"
          git pull --rebase --autostash -X theirs origin main && git push || true
      - name: Marcar progreso final
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          if [ -z "${{ steps.producir.outputs.id }}" ]; then node agentes/progreso.mjs 0 'Ciclo sin video: no habia guion aprobado' || true
          elif [ "${{ steps.panel.outputs.aprobado }}" = "false" ]; then node agentes/progreso.mjs 0 'La revision tecnica detecto defectos graves o datos incompletos: no se publico' || true
          elif [ "${{ steps.destino.outputs.valor }}" = "tiktok" ] && [ "${{ steps.redes.outcome }}" = "success" ]; then node agentes/progreso.mjs 100 'Largo aceptado por Buffer para publicacion inmediata en TikTok' || true
          elif [ "${{ steps.destino.outputs.valor }}" = "youtube" ] && [ "${{ steps.subir.outputs.subido }}" = "true" ]; then node agentes/progreso.mjs 100 'Largo subido a YouTube y confirmado por la API' || true
          elif [ "${{ steps.destino.outputs.valor }}" = "ambos" ] && [ "${{ steps.subir.outputs.subido }}" = "true" ]; then node agentes/progreso.mjs 100 'Video subido a YouTube y enviado a redes' || true
          else node agentes/progreso.mjs 85 'Video renderizado, pero el destino no confirmó la recepción. Sigue pendiente para reintento.' || true; echo 'ERROR: la publicacion no fue confirmada; el video permanece pendiente.'; exit 1; fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: terminado"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done

      - name: Cerrar secuencia única después de publicar el Short
        if: ${{ success() && hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.producir.outputs.formato == 'short' && steps.destino.outputs.valor != 'tiktok' && steps.panel.outputs.aprobado == 'true' && steps.subir.outputs.subido == 'true' }}
        env:
          ID: ${{ steps.producir.outputs.id }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/secuencia-largo-short.json"; if (!fs.existsSync(p)) process.exit(0); const x=JSON.parse(fs.readFileSync(p,"utf8")); if (!x.activo || x.fase !== "short-encolado") process.exit(0); x.activo=false; x.fase="completada"; x.videoShortId=process.env.ID; x.fechaShortPublicado=new Date().toISOString(); fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n");'
          git add agentes/secuencia-largo-short.json
          if git diff --cached --quiet; then echo "La secuencia ya estaba cerrada; no hay cambios que confirmar."; exit 0; fi
          git commit -m "Completar secuencia extraordinaria largo y Short"
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: Encadenar el segundo largo para YouTube después de TikTok
        if: ${{ always() && steps.destino.outputs.valor == 'tiktok' }}
        env:
          REDES_OK: ${{ steps.redes.outcome }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/publicacion.json"; let x={modo:"ahora",destino:"ambos"}; try{x=JSON.parse(fs.readFileSync(p,"utf8"));}catch{}; if(process.env.REDES_OK==="success"){x.destino="youtube"; fs.writeFileSync("agentes/oficina.disparo",new Date().toISOString()+"|largo|\n"); console.log("TikTok aceptó el primer largo; se prepara el segundo largo exclusivamente para YouTube.");}else{x.destino="ambos"; console.log("TikTok no confirmó el envío; se restaura la publicación automática normal y no se encadena otro largo.");} fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");'
          git add agentes/publicacion.json agentes/oficina.disparo
          if git diff --cached --quiet; then echo "Sin cambios de destino."; else git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"; git commit -m "Secuencia: preparar segundo largo para YouTube o restaurar destino"; git pull --rebase --autostash -X theirs origin main; git push; fi
      - name: Restaurar destinos automáticos después del largo de YouTube
        if: ${{ always() && steps.destino.outputs.valor == 'youtube' }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/publicacion.json"; let x={modo:"ahora",destino:"ambos"}; try{x=JSON.parse(fs.readFileSync(p,"utf8"));}catch{}; if(x.destino!=="ambos"){x.destino="ambos";fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");}'
          git add agentes/publicacion.json
          if git diff --cached --quiet; then echo "Los destinos automáticos ya estaban restaurados."; else git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"; git commit -m "Restaurar publicación automática a todos los destinos"; git pull --rebase --autostash -X theirs origin main; git push; fi
      - name: Encolar un Short único después del largo publicado
        if: ${{ success() && hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.producir.outputs.formato == 'largo' && steps.destino.outputs.valor != 'tiktok' && steps.panel.outputs.aprobado == 'true' && steps.subir.outputs.subido == 'true' }}
        env:
          ID: ${{ steps.producir.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/secuencia-largo-short.json"; if (!fs.existsSync(p)) process.exit(0); const x=JSON.parse(fs.readFileSync(p,"utf8")); if (!x.activo || x.fase !== "largo") process.exit(0); x.fase="short-encolado"; x.videoLargoId=process.env.ID; x.fechaLargoPublicado=new Date().toISOString(); fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n"); fs.writeFileSync("agentes/oficina.disparo", new Date().toISOString()+"|short\n");'
          git add agentes/secuencia-largo-short.json agentes/oficina.disparo
          git commit -m "Encolar el Short único después de publicar el largo"
          git pull --rebase --autostash -X theirs origin main
          git push
          gh workflow run oficina.yml --ref main -f formato=short
