name: Produccion

# DespuÃ©s de cada corrida de la Oficina: toma el guion aprobado, graba la voz, renderiza el video y (si hay claves) lo sube como privado a YouTube.
on:
  workflow_run:
    workflows:
      - Oficina
    types:
      - completed
  push:
    paths:
      - 'agentes/produccion.disparo'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  producir:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        with:
          node-version: 22
      - name: Dependencias del sistema (Chrome de Remotion y ffmpeg)
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: npm install --no-audit --no-fund
      - name: Voz (msedge-tts solo para este flujo)
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        run: npm install --no-save --no-audit --no-fund msedge-tts@2.1.1
      - name: Marcar inicio de producciÃ³n
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          node agentes/progreso.mjs 40 "Grabando la voz y renderizando el video" || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: Grabando la voz y renderizando el video"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done
      - name: Producir el video
        if: ${{ hashFiles('agentes/PAUSA') == '' }}
        id: producir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node agentes/producir.mjs
      - name: Autopsia (por quÃ© los videos anteriores no cogieron vistas)
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node agentes/vistas.mjs && node agentes/autopsia.mjs
      - name: 'Revision tecnica del video (Gemini: imagen, audio y subtitulos)'
        id: panel
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agentes/panel.mjs
      - name: Ayuda mutua (los puestos libres hacen otras tareas)
        if: ${{ steps.producir.outputs.id != '' }}
        continue-on-error: true
        env:
          CANAL: ${{ steps.producir.outputs.canal }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: timeout 240 node agentes/ayuda.mjs; timeout 240 node agentes/funciones.mjs; timeout 240 node agentes/conciencia.mjs
      - name: Marcar progreso tras la revision tecnica
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          node agentes/progreso.mjs 90 'Revision tecnica lista - listo para subir' || true
      - name: Guardar el avance en el repositorio
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git add guion/serie 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Produccion: avance automatico"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push && break
            echo "No pude guardar (intento $i); reintento en 5 s"
            sleep 5
          done
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then echo "ERROR: no se pudo subir el resultado al repositorio"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' }}
        with:
          name: video-${{ steps.producir.outputs.id }}
          path: out/serie/*.mp4
          retention-days: 14
      - name: Subir a YouTube (publicaciÃ³n automÃ¡tica si hay credenciales)
        id: subir
        if: ${{ hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.panel.outputs.aprobado == 'true' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_CANAL: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', steps.producir.outputs.canal)] }}
        run: |
          node agentes/subir.mjs
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Publicador: resultado de la subida"
          git pull --rebase --autostash -X theirs origin main && git push || true
      - name: Publicar en Facebook, Instagram y TikTok (Windsor y Buffer; solo si hay claves; nunca falla el ciclo)
        if: ${{ steps.producir.outputs.id != '' && steps.panel.outputs.aprobado == 'true' }}
        continue-on-error: true
        env:
          ID: ${{ steps.producir.outputs.id }}
          CANAL: ${{ steps.producir.outputs.canal }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          FB_VIDEOS_TOKEN: ${{ secrets.FB_VIDEOS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node agentes/facebook.mjs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Publicador: resultado de Facebook"
          git pull --rebase --autostash -X theirs origin main && git push || true
      - name: Marcar progreso final
        if: ${{ always() && hashFiles('agentes/PAUSA') == '' }}
        run: |
          if [ -z "${{ steps.producir.outputs.id }}" ]; then node agentes/progreso.mjs 0 'Ciclo sin video: no habia guion aprobado' || true
          elif [ "${{ steps.panel.outputs.aprobado }}" = "false" ]; then node agentes/progreso.mjs 0 'La revision tecnica detecto defectos graves o datos incompletos: no se publico' || true
          elif [ "${{ steps.subir.outputs.subido }}" = "true" ]; then node agentes/progreso.mjs 100 'Video subido a YouTube y confirmado por la API' || true
          else node agentes/progreso.mjs 85 'Video renderizado, pero NO publicado. Sigue pendiente para reintento; revisar el motivo en el registro.' || true; echo 'ERROR: la publicaciÃ³n no fue confirmada; el video permanece en cola para reintento.'; exit 1; fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: terminado"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done

      - name: Cerrar secuencia única después de publicar el Short
        if: ${{ success() && hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.producir.outputs.formato == 'short' && steps.panel.outputs.aprobado == 'true' && steps.subir.outputs.subido == 'true' }}
        env:
          ID: ${{ steps.producir.outputs.id }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/secuencia-largo-short.json"; if (!fs.existsSync(p)) process.exit(0); const x=JSON.parse(fs.readFileSync(p,"utf8")); if (!x.activo || x.fase !== "short-encolado") process.exit(0); x.activo=false; x.fase="completada"; x.videoShortId=process.env.ID; x.fechaShortPublicado=new Date().toISOString(); fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n");'
          git add agentes/secuencia-largo-short.json
          git commit -m "Completar secuencia extraordinaria largo y Short"
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: Encolar un Short único después del largo publicado
        if: ${{ success() && hashFiles('agentes/PAUSA') == '' && steps.producir.outputs.id != '' && steps.producir.outputs.formato == 'largo' && steps.panel.outputs.aprobado == 'true' && steps.subir.outputs.subido == 'true' }}
        env:
          ID: ${{ steps.producir.outputs.id }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="agentes/secuencia-largo-short.json"; if (!fs.existsSync(p)) process.exit(0); const x=JSON.parse(fs.readFileSync(p,"utf8")); if (!x.activo || x.fase !== "largo") process.exit(0); x.fase="short-encolado"; x.videoLargoId=process.env.ID; x.fechaLargoPublicado=new Date().toISOString(); fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n"); fs.writeFileSync("agentes/oficina.disparo", new Date().toISOString()+"|short\n");'
          git add agentes/secuencia-largo-short.json agentes/oficina.disparo
          git commit -m "Encolar el Short único después de publicar el largo"
          git pull --rebase --autostash -X theirs origin main
          git push
