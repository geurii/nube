name: Lote 30 - render secuencial
on:
  push:
    paths:
      - '.github/workflows/lote-30-render.yml'
      - 'agentes/lote-30-contenidos.json'
      - 'agentes/pintor.mjs'
      - 'src/components/fondos/PixelPintado.tsx'
      - 'src/components/fondos/pintadoPro.ts'
      - 'scripts/probar-lote-30.mjs'
      - 'scripts/preparar-lote-30.mjs'
      - 'scripts/render-lote-30.mjs'
      - 'scripts/lote.mjs'
      - 'scripts/ejecutar-hijo.mjs'
      - 'scripts/activar-lote-30-publicacion.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lote-30-render
  cancel-in-progress: false
jobs:
  renderizar:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Fix lote 30 JSON persistence') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar FFmpeg y Chrome para Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          timeout 15m npm install --no-audit --no-fund
          timeout 5m npm install --no-save --no-audit --no-fund msedge-tts@2.1.1
      - name: Validar los 30 temas, cinco escenas y anclas narrativas
        run: |
          node --check agentes/pintor.mjs
          node --check scripts/probar-lote-30.mjs
          node --check scripts/preparar-lote-30.mjs
          node --check scripts/render-lote-30.mjs
          node scripts/probar-lote-30.mjs
      - name: Preparar los 30 guiones y 600 visuales específicos
        run: node scripts/preparar-lote-30.mjs
      - name: Comprobar TypeScript y Remotion
        run: npx tsc --noEmit
      - name: Renderizar uno por uno y comprobar cada MP4
        run: node scripts/render-lote-30.mjs
      - name: Guardar guiones, subtítulos, visuales y progreso
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add guion/serie public/pintados agentes/lote-30-publicacion.json
          git add oficina-salida/lqns/guion-*.json
          git diff --cached --quiet || git commit -m "Lote 30: guiones, subtítulos y visuales renderizados"
          git pull --rebase --autostash -X theirs origin main
          git push
      - name: Subir los 30 MP4 optimizados como artefacto único
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lote-30-videos
          path: out/serie/*-subida.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Habilitar publicaciones solo con 30 de 30
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/activar-lote-30-publicacion.mjs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add agentes/lote-30-publicacion.json
          git commit -m "Lote 30: todos los renders aprobados; activar cola cada veinte minutos"
          git pull --rebase --autostash -X theirs origin main
          git push
      - name: Guardar diagnóstico cuando el lote no llega a 30 de 30
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lote-30-diagnostico
          path: |
            agentes/lote-30-publicacion.json
            guion/serie/*.json
          if-no-files-found: warn
          retention-days: 14
