name: Traer videos

# Junta los videos ya renderizados (de una ejecucion de "Render videos") en la rama "videos"
# para poder bajarlos con git, sin ventanas de descarga. No vuelve a renderizar nada.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numero largo de la ejecucion de Render videos (el de la URL .../runs/NUMERO)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  traer:
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: bajados
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Instalar ffmpeg (para reducir el largo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Publicar en la rama videos
        run: |
          set -e
          ls -la bajados
          mkdir -p /tmp/salida
          cp bajados/*-subida.mp4 /tmp/salida/
          # GitHub no deja subir archivos de mas de 100 MB: el largo (241 MB) se reduce a ~90 MB
          # (1080p, 3 Mbps) para poder bajarlo con git. El original sigue en el artefacto de Render videos.
          if [ -f bajados/largo-colores.mp4 ]; then
            ffmpeg -y -loglevel error -i bajados/largo-colores.mp4 -c:v libx264 -preset medium -b:v 3000k -maxrate 3400k -bufsize 6000k -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart /tmp/salida/largo-colores-1080p.mp4
          fi
          ls -la /tmp/salida
          find /tmp/salida -size +95M -print -delete
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan videos
          git rm -rf . > /dev/null
          cp /tmp/salida/* .
          git add -A
          git commit -m "Videos renderizados (ejecucion $RUN_ID)"
          git push --force origin videos
