name: Encargo del dueno

# Encargos desde el Estudio de la oficina: investigar un tema, buscar ideas nuevas, criticar los videos u otro encargo.
# Se activa al cambiar oficina-salida/<canal>/encargo-pedido.json (lo escribe el Estudio) o a mano. No publica nada.
on:
  push:
    paths:
      - 'oficina-salida/*/encargo-pedido.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encargo
  cancel-in-progress: false

jobs:
  encargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hacer el encargo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CANAL: lqns
        run: node agentes/encargo.mjs
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Encargo del dueno: resultado"
          for i in 1 2 3 4; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
