name: Oficina

# Departamentos: los largos buscan documentales de 8+ minutos en canales establecidos y exigen 3 dominios web independientes; Wikipedia solo aporta contexto.
# y el Escenógrafo elige los fondos. Resultado en oficina-salida/ (guion + informe + estado para la oficina 3D).
on:
  schedule:
    - cron: '0 11 * * *'     # Short 1: 07:00 hora RD
    - cron: '0 20 * * *'     # Short 2: 16:00 hora RD
    - cron: '0 16 * * *'     # Video largo: 12:00 hora RD, YouTube + TikTok
    - cron: '0 1 * * *'      # Short 3: 21:00 hora RD
  push:
    paths:
      - 'agentes/oficina.disparo'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Opcional: tema libre. Vacio = la Oficina elige una curiosidad y usa material consultable; sin respaldo, solo ficción explícita'
        required: false
      formato:
        description: 'short o largo'
        required: false
        default: 'largo'
      canal:
        description: 'Opcional: solo este canal (ej: lqns). Vacio = todos los activos'
        required: false
      palabras:
        description: 'Solo para largo: 1200–1350 palabras para 8–10 minutos'
        required: false
        default: '1250'

permissions:
  contents: write
  actions: write
  models: read

# Un solo ciclo largo activo: al lanzar una versión corregida, se cancela el ciclo obsoleto que bloquea la cola.
concurrency:
  group: oficina-documentales-multilingues-v4
  cancel-in-progress: true

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  oficina:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Cancelar ejecuciones antiguas de Oficina
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$GH_REPO/actions/workflows/oficina.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\")) | .id")
          for id in $ids; do
            echo "Cancelando ejecución antigua de Oficina: $id"
            gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || true
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de notificación al teléfono
        continue-on-error: true
        run: |
          node --input-type=module -e 'import {avisarTelefono} from "./agentes/aviso.mjs"; const ok=avisarTelefono("info","Oficina reactivada","La Oficina está activa. Esta es una prueba de entrega de notificaciones."); if (!ok) console.error("No se confirmó el envío del aviso al servicio ntfy.");'
      - name: Control operativo (sin límite mensual de minutos; solo evita bucles de publicaciones)
        id: pres
        env:
          GH_TOKEN: ${{ github.token }}
          FORMATO_ACTUAL: ${{ inputs.formato || steps.pres.outputs.formato || (github.event.schedule == '0 16 * * *' && 'largo' || 'short') }}
          CANAL_PENDIENTE: ${{ inputs.canal }}
        run: |
          if [ -f agentes/PAUSA ]; then echo "ok=no" >> "$GITHUB_OUTPUT"; echo "PRODUCCION EN PAUSA (existe agentes/PAUSA): este ciclo se salta."; exit 0; fi
          # Por defecto los encargos push/manual SÍ deben ejecutar el ciclo; los horarios pueden anularlo con ok=no.
          echo "ok=yes" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            fase=""
            if [ -f agentes/secuencia-largo-short.json ]; then
              fase=$(node -e "try { const x=require('./agentes/secuencia-largo-short.json'); process.stdout.write(x.activo ? (x.fase || 'bloqueada') : ''); } catch { process.stdout.write('bloqueada'); }")
            fi
            if [ "$fase" = "bloqueada" ]; then
              echo "ok=no" >> "$GITHUB_OUTPUT"
              echo "El estado de la secuencia no se puede leer: se pausa de forma segura."
            elif [ "$fase" = "largo" ]; then
              if [ "${{ github.event.schedule }}" = '0 16 * * *' ]; then
                echo "formato=largo" >> "$GITHUB_OUTPUT"
                echo "Secuencia extraordinaria: este horario reintenta el video largo pendiente."
              else
                echo "ok=no" >> "$GITHUB_OUTPUT"
                echo "Secuencia extraordinaria: se omiten los Shorts hasta publicar el largo."
              fi
            elif [ "$fase" = "short-encolado" ]; then
              if [ "${{ github.event.schedule }}" != '0 16 * * *' ]; then
                echo "formato=short" >> "$GITHUB_OUTPUT"
                echo "Secuencia extraordinaria: este horario reintenta el Short pendiente."
              else
                echo "ok=no" >> "$GITHUB_OUTPUT"
                echo "Secuencia extraordinaria: se omite el horario largo mientras se publica el Short."
              fi
            elif ! node agentes/encadenar.mjs; then
              echo "ok=no" >> "$GITHUB_OUTPUT"
              echo "Meta operativa diaria cumplida: este ciclo se salta."
            fi
          fi
          # tema elegido en el Estudio ("fecha|formato|Tema"): solo letras, números y signos simples
          if [ "${{ github.event_name }}" = "push" ] && [ -f agentes/oficina.disparo ]; then
            tema_d=$(cut -d'|' -f3 agentes/oficina.disparo | tr -d '\r\n' | sed 's/[^[:alnum:] .,()&:-]//g' | cut -c1-90)
            if [ -n "$tema_d" ]; then echo "tema=$tema_d" >> "$GITHUB_OUTPUT"; echo "Tema elegido en el Estudio: $tema_d"; fi
          fi
          # Formato y canal se fijan en el disparo: fecha|formato|tema|canal.
          if [ "${{ github.event_name }}" = "push" ] && [ -f agentes/oficina.disparo ]; then
            if [ "$(cut -d'|' -f2 agentes/oficina.disparo | tr -d '[:space:]')" = "largo" ]; then
              echo "formato=largo" >> "$GITHUB_OUTPUT"
              echo "Formato elegido en el boton: LARGO"
            else
              echo "formato=short" >> "$GITHUB_OUTPUT"
              echo "Formato elegido en el boton: SHORT"
            fi
            canal_d=$(cut -d'|' -f4 agentes/oficina.disparo | tr -d '\r\n' | tr -cd '[:alnum:]_.-' | cut -c1-40)
            if [ -n "$canal_d" ]; then echo "canal=$canal_d" >> "$GITHUB_OUTPUT"; echo "Canal solicitado: $canal_d"; fi
          else
            echo "Formato: segun el horario o Short"
          fi
      - name: Prueba de humo (simulada, no gasta Groq)
        id: humo
        if: always()
        run: |
          node --check agentes/reglas-guion.mjs
          node --check agentes/llm.mjs
          node --check agentes/analizar-videos.mjs
          node agentes/probar-subtitulos-publicos.mjs
          node --check agentes/fuentes-guion.mjs
          node agentes/probar-fuentes-guion.mjs
          node --check agentes/oficina.mjs
          node --check agentes/producir.mjs
          node --check agentes/pintor.mjs
          node --check agentes/probar-oficina.mjs
          node --check agentes/probar-proveedores.mjs
          node --check agentes/encadenar.mjs
          node --check agentes/radar.mjs
          node agentes/probar-referencias-largas.mjs
          node --check agentes/cazador.mjs
          node --check agentes/producir.mjs
          node --check agentes/subir.mjs
          node --check agentes/facebook.mjs
          node --check agentes/tiktok.mjs
          node agentes/probar-oficina.mjs
          node agentes/probar-proveedores.mjs
      - name: Marcar inicio del video
        if: always() && steps.pres.outputs.ok != 'no' && steps.humo.outcome == 'success'
        run: |
          PROGRESO_DE=oficina node agentes/progreso.mjs 5 "Buscando tema y escribiendo el guion" || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: Buscando tema y escribiendo el guion"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done
      - name: Ciclo de todos los canales activos (el Cazador primero; si uno falla, los demás siguen)
        if: steps.pres.outputs.ok != 'no' && steps.humo.outcome == 'success'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TEMA: ${{ inputs.tema || steps.pres.outputs.tema }}
          CANAL_PEDIDO: ${{ inputs.canal || steps.pres.outputs.canal }}
          GH_TOKEN: ${{ github.token }}
          FORMATO_ACTUAL: ${{ inputs.formato || steps.pres.outputs.formato || (github.event.schedule == '0 16 * * *' && 'largo' || 'short') }}
          FORMATO: ${{ inputs.formato || steps.pres.outputs.formato || (github.event.schedule == '0 16 * * *' && 'largo' || 'short') }}
          PALABRAS: ${{ inputs.palabras }}
        run: |
          canales=$(CANAL_PEDIDO="$CANAL_PEDIDO" node agentes/canales-activos.mjs)
          if [ -n "$CANAL_PEDIDO" ] && [ -z "$canales" ]; then
            echo "ERROR: el canal solicitado no existe o no está activo: $CANAL_PEDIDO"
            exit 1
          fi
          echo "Canales de este ciclo: $canales"
          limite=$((SECONDS + 40 * 60))
          canal_pendiente=""
          tema_fijo="${TEMA:-}"
          for c in $canales; do
            echo "=== $c ==="
            # Un encargo con tema explícito no debe perder tiempo ni créditos buscando tendencias.
            # Cazador, Analytics, Radar y vistas solo se ejecutan cuando la Oficina debe elegir tema.
            if [ -z "$tema_fijo" ]; then
              if [ "$FORMATO_ACTUAL" = "largo" ]; then
                echo "LARGO: se prioriza la búsqueda de documentales de 8+ minutos."
              else
                CANAL=$c timeout 120 node agentes/vistas.mjs || true
                CANAL=$c timeout 120 node agentes/analytics.mjs || true
                CANAL=$c timeout 120 node agentes/cazador.mjs || true
              fi
              CANAL=$c FORMATO=$FORMATO_ACTUAL timeout 300 node agentes/radar.mjs || true
            else
              echo "Tema fijo solicitado: $tema_fijo. Se omiten Cazador, Analytics, vistas y Radar."
            fi
            intento=0
            espera=30
            limite_intento=900
            max_ciclos=3
            if [ -n "$tema_fijo" ]; then max_ciclos=1; fi
            if [ "$FORMATO_ACTUAL" = "largo" ]; then limite_intento=2100; fi
            cuota_agotada=0
            referencia_no_disponible=0
            while [ "$SECONDS" -lt "$limite" ] && [ "$intento" -lt "$max_ciclos" ]; do
              intento=$((intento + 1))
              echo "Intento continuo $intento para $c (sin límite de rechazos)."
              echo "::notice::Inicio del intento $intento para $c a $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
              if [ -n "$tema_fijo" ] || [ "$intento" -eq 1 ]; then
                if CANAL=$c TEMA="$tema_fijo" timeout "$limite_intento" node agentes/oficina.mjs; then rc=0; else rc=$?; fi
              else
                if env -u TEMA CANAL=$c timeout "$limite_intento" node agentes/oficina.mjs; then rc=0; else rc=$?; fi
              fi
              echo "::notice::Fin del intento $intento para $c; código de salida=$rc; duración acumulada=$((SECONDS))s."
              if [ "$rc" -eq 76 ]; then
                referencia_no_disponible=1
                echo "::warning::No hay referencia viral verificable. Se detiene sin repetir la búsqueda ni consumir otra ventana."
                break
              fi
              if [ "$rc" -eq 75 ]; then
                cuota_agotada=1
                echo "::warning::Todos los proveedores están en cooldown. Se detiene aquí: no se gastan más solicitudes ni se encadena otro ciclo."
                break
              fi
              if [ "$rc" -eq 124 ]; then echo "::warning::La generación agotó su límite individual de ${limite_intento}s; se intentará en la siguiente ventana."; fi
              if CANAL=$c node agentes/ultimo-aprobado.mjs; then
                echo "Guion aprobado para $c en el intento $intento."
                break
              fi
              if [ -n "$tema_fijo" ]; then
                echo "El tema solicitado no fue aprobado en su ciclo interno de cuatro revisiones. No se sustituye por otro tema ni se consume otra ronda."
                break
              fi
              echo "No hay guion aprobado. Se cambia de tema/proveedor y se reintenta en ${espera}s."
              sleep "$espera"
              espera=$((espera < 300 ? espera * 2 : 300))
            done
            if [ "$referencia_no_disponible" -eq 1 ]; then
              echo "Ciclo cerrado: faltó referencia verificable; se espera al siguiente ciclo sin bucle."
              break
            fi
            if [ "$cuota_agotada" -eq 1 ]; then
              echo "Ciclo cerrado por cuota agotada. El cooldown queda guardado para el siguiente horario."
              break
            fi
            if ! CANAL=$c node agentes/ultimo-aprobado.mjs; then
              if [ -n "$tema_fijo" ]; then
                echo "El tema fijo no dejó un guion aprobado. Se detiene aquí; no se dispara otra ejecución con un tema distinto."
                break
              fi
              canal_pendiente="$c"
              echo "Ventana agotada para $c; se continuará automáticamente en otra ejecución."
              break
            fi
            CANAL=$c timeout 120 node agentes/autopsia.mjs || true
            CANAL=$c timeout 120 node agentes/ayuda.mjs || true
            CANAL=$c timeout 120 node agentes/funciones.mjs || true
            CANAL=$c timeout 120 node agentes/conciencia.mjs || true
          done
          if [ -n "$canal_pendiente" ]; then
            echo "Encadenando otra ejecución para continuar buscando un guion aprobado."
            payload=$(CANAL_PENDIENTE="$canal_pendiente" node -e 'console.log(JSON.stringify({ref:"main",inputs:{formato:process.env.FORMATO_ACTUAL || "short",canal:process.env.CANAL_PENDIENTE}}))')
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/geurii/nube/actions/workflows/oficina.yml/dispatches \
              -d "$payload"
            echo "Continuación solicitada para $canal_pendiente."
          fi
          exit 0
      - name: Marcar progreso del guion
        if: always() && steps.pres.outputs.ok != 'no'
        run: |
          if node agentes/ultimo-aprobado.mjs; then PROGRESO_DE=oficina node agentes/progreso.mjs 35 'Guion aprobado: preparando voz y video'; else PROGRESO_DE=oficina node agentes/progreso.mjs 0 'Sin guion aprobado en este ciclo (proveedores de IA temporalmente no disponibles o tema rechazado): se reintenta'; fi
      - name: Guardar el resultado en el repositorio
        if: always() && steps.pres.outputs.ok != 'no'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git add public/pintados 2>/dev/null || true
          git add public/referencias 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Oficina: resultado automatico"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push && break
            echo "No pude guardar (intento $i); reintento en 5 s"
            sleep 5
          done
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then echo "ERROR: no se pudo subir el resultado al repositorio"; exit 1; fi
      - name: Impedir producción si este ciclo no aprobó un guion
        if: always() && steps.pres.outputs.ok != 'no'
        env:
          OFICINA_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="oficina-salida/produccion-pendiente.json"; let xs=[]; try{xs=JSON.parse(fs.readFileSync(p,"utf8"));}catch{}; const ok=Array.isArray(xs)&&xs.some(x=>String(x.runId)===String(process.env.OFICINA_RUN_ID)); if(!ok){console.error("Este ciclo no dejó un guion aprobado en su manifiesto. Producción no debe arrancar.");process.exit(1)} console.log("Manifiesto de guion aprobado confirmado para esta ejecución.");'
      - name: Esperar al siguiente horario programado
        if: always()
        run: echo Ciclos ejecutados segun horario programado
