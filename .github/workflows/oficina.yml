name: Oficina

# Departamentos de guion: investiga en Wikipedia, escribe con Groq, el Editor lo critica, el Verificador comprueba cada dato
# y el Escenógrafo elige los fondos. Resultado en oficina-salida/ (guion + informe + estado para la oficina 3D).
on:
  schedule:
    - cron: '0 2,8,14,20 * * *'   # un Short nuevo cada 6 horas
    - cron: '0 12 */2 * *'   # un video largo un dia si y otro no
  push:
    paths:
      - 'agentes/oficina.disparo'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Opcional: titulo exacto de Wikipedia. Vacio = la oficina elige sola'
        required: false
      formato:
        description: 'short o largo'
        required: false
        default: 'short'
      canal:
        description: 'Opcional: solo este canal (ej: lqns). Vacio = todos los activos'
        required: false
      palabras:
        description: 'Solo para largo: palabras aproximadas (ej: 900)'
        required: false
        default: '900'

permissions:
  contents: write

# Un solo turno a la vez: si una corrida sigue en marcha, la siguiente espera (no se pisan).
concurrency:
  group: oficina
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  oficina:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de humo (simulada, no gasta Groq)
        run: node agentes/probar-oficina.mjs
      - name: Ciclo de todos los canales activos (el Cazador primero; si uno falla, los demás siguen)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TEMA: ${{ inputs.tema }}
          CANAL_PEDIDO: ${{ inputs.canal }}
          FORMATO: ${{ inputs.formato || (github.event.schedule == '0 12 */2 * *' && 'largo' || 'short') }}
          PALABRAS: ${{ inputs.palabras }}
        run: |
          canales=$(node agentes/canales-activos.mjs)
          echo "Canales de este ciclo: $canales"
          fallo=0
          for c in $canales; do
            echo "=== $c ==="
            CANAL=$c node agentes/vistas.mjs || true
            CANAL=$c node agentes/analytics.mjs || true
            CANAL=$c node agentes/autopsia.mjs || true
            CANAL=$c node agentes/cazador.mjs || true
            for intento in 1 2 3; do
              CANAL=$c node agentes/oficina.mjs || fallo=1
              CANAL=$c node agentes/ultimo-aprobado.mjs && break
              echo "No salió un guion aprobado (intento $intento de 3): pruebo con otro tema."
            done
            CANAL=$c node agentes/ayuda.mjs || true
            CANAL=$c node agentes/funciones.mjs || true
            CANAL=$c node agentes/conciencia.mjs || true
          done
          exit $fallo
      - name: Guardar el resultado en el repositorio
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida public/pintados || true
          git diff --cached --quiet || git commit -m "Oficina: resultado automatico"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            echo "No pude guardar (intento $i); reintento en 5 s"
            sleep 5
          done
