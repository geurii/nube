name: Oficina

# Departamentos de guion: investiga en Wikipedia, escribe con Groq, el Editor lo critica, el Verificador comprueba cada dato
# y el Escenógrafo elige los fondos. Resultado en oficina-salida/ (guion + informe + estado para la oficina 3D).
on:
  schedule:
    - cron: '23 1,4,7,10,13,16,19,22 * * *'   # Shorts: cada 3 horas (UTC)
    - cron: '23 0,12 * * *'   # videos largos: cada 12 horas (UTC)
  push:
    paths:
      - 'agentes/oficina.disparo'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Opcional: titulo exacto de Wikipedia. Vacio = la oficina elige sola'
        required: false
      formato:
        description: 'short o largo'
        required: false
        default: 'largo'
      canal:
        description: 'Opcional: solo este canal (ej: lqns). Vacio = todos los activos'
        required: false
      palabras:
        description: 'Solo para largo: palabras aproximadas (ej: 900)'
        required: false
        default: '900'

permissions:
  contents: write
  actions: write
  models: read

# Un solo turno a la vez: si una corrida sigue en marcha, la siguiente espera (no se pisan).
concurrency:
  group: oficina
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  oficina:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Presupuesto (los ciclos programados no pasan del presupuesto de minutos ni de la meta diaria)
        id: pres
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f agentes/PAUSA ]; then echo "ok=no" >> "$GITHUB_OUTPUT"; echo "PRODUCCION EN PAUSA (existe agentes/PAUSA): este ciclo se salta."; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && ! node agentes/encadenar.mjs; then echo "ok=no" >> "$GITHUB_OUTPUT"; echo "Sin presupuesto o meta cumplida: este ciclo se salta."; fi
          # tema elegido en el Estudio ("fecha|formato|Tema"): solo letras, números y signos simples
          if [ "${{ github.event_name }}" = "push" ] && [ -f agentes/oficina.disparo ]; then
            tema_d=$(cut -d'|' -f3 agentes/oficina.disparo | tr -d '\r\n' | sed 's/[^[:alnum:] .,()&:-]//g' | cut -c1-90)
            if [ -n "$tema_d" ]; then echo "tema=$tema_d" >> "$GITHUB_OUTPUT"; echo "Tema elegido en el Estudio: $tema_d"; fi
          fi
          # formato elegido con el botón "Producir ahora" (el archivo trae "fecha|short" o "fecha|largo"); sin elección, Short
          if [ "${{ github.event_name }}" = "push" ] && [ -f agentes/oficina.disparo ] && [ "$(cut -d'|' -f2 agentes/oficina.disparo | tr -d '[:space:]')" = "largo" ]; then echo "formato=largo" >> "$GITHUB_OUTPUT"; echo "Formato elegido en el boton: LARGO"; else echo "Formato: segun el horario o Short"; fi
      - name: Prueba de humo (simulada, no gasta Groq)
        if: steps.pres.outputs.ok != 'no'
        run: node agentes/probar-oficina.mjs
      - name: Marcar inicio del video
        if: always() && steps.pres.outputs.ok != 'no'
        run: |
          PROGRESO_DE=oficina node agentes/progreso.mjs 5 "Buscando tema y escribiendo el guion" || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Progreso: Buscando tema y escribiendo el guion"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 4; done
      - name: Ciclo de todos los canales activos (el Cazador primero; si uno falla, los demás siguen)
        if: steps.pres.outputs.ok != 'no'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TEMA: ${{ inputs.tema || steps.pres.outputs.tema }}
          CANAL_PEDIDO: ${{ inputs.canal }}
          FORMATO: ${{ inputs.formato || steps.pres.outputs.formato || (github.event.schedule == '23 0,12 * * *' && 'largo' || 'short') }}
          PALABRAS: ${{ inputs.palabras }}
        run: |
          canales=$(node agentes/canales-activos.mjs)
          echo "Canales de este ciclo: $canales"
          fallo=0
          for c in $canales; do
            echo "=== $c ==="
            CANAL=$c timeout 120 node agentes/vistas.mjs || true
            CANAL=$c timeout 120 node agentes/analytics.mjs || true
            CANAL=$c timeout 120 node agentes/cazador.mjs || true
            CANAL=$c timeout 200 node agentes/radar.mjs || true
            for intento in 1 2 3; do
              CANAL=$c timeout 900 node agentes/oficina.mjs || fallo=1
              CANAL=$c node agentes/ultimo-aprobado.mjs && break
              echo "No salió un guion aprobado (intento $intento de 3): pruebo con otro tema."
            done
            if CANAL=$c node agentes/ultimo-aprobado.mjs | grep -q aprobado; then
              CANAL=$c timeout 120 node agentes/autopsia.mjs || true
              CANAL=$c timeout 120 node agentes/ayuda.mjs || true
              CANAL=$c timeout 120 node agentes/funciones.mjs || true
              CANAL=$c timeout 120 node agentes/conciencia.mjs || true
            else
              echo "No hubo guion aprobado para $c tras 3 intentos; no se activa Produccion."
              fallo=1
            fi
          done
          exit $fallo
      - name: Marcar progreso del guion
        if: always() && steps.pres.outputs.ok != 'no'
        run: |
          if node agentes/ultimo-aprobado.mjs | grep -q 'oficina: aprobado'; then PROGRESO_DE=oficina node agentes/progreso.mjs 35 'Guion aprobado: preparando voz y video'; else PROGRESO_DE=oficina node agentes/progreso.mjs 0 'Sin guion aprobado en este ciclo (cuota de IA agotada o tema rechazado): se reintenta'; fi
      - name: Guardar el resultado en el repositorio
        if: always() && steps.pres.outputs.ok != 'no'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git add public/pintados 2>/dev/null || true
          git add public/referencias 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Oficina: resultado automatico"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push && break
            echo "No pude guardar (intento $i); reintento en 5 s"
            sleep 5
          done
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then echo "ERROR: no se pudo subir el resultado al repositorio"; exit 1; fi
      - name: Esperar al siguiente horario programado
        if: always()
        run: echo Ciclos ejecutados segun horario programado
