name: Jules

# Cuando el dueño le escribe a Jules desde la oficina 3D (archivo en oficina-salida/chat-pendiente/), Jules responde y da órdenes al equipo.
on:
  push:
    paths:
      - 'oficina-salida/chat-pendiente/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jules
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  responder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Jules responde
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
        run: node agentes/jules.mjs
      - name: Guardar la conversación
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Jules: respuesta"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push && break
            sleep 5
          done
