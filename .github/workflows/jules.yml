name: Jules

# Cuando el dueño le escribe a Jules desde la oficina 3D (archivo en oficina-salida/chat-pendiente/), Jules responde y da órdenes al equipo.
on:
  push:
    paths:
      - 'oficina-salida/chat-pendiente/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jules
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jules responde
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node agentes/jules.mjs
      - name: Guardar la conversación
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Jules: respuesta"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
