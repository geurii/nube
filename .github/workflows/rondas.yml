name: Rondas

# Para que nadie se quede parado: cada 6 horas los puestos que están libres toman tareas (ayuda mutua, funciones extra, reflexión).
on:
  schedule:
    - cron: '37 */6 * * *'
  push:
    paths:
      - 'agentes/rondas.disparo'
  workflow_dispatch:

permissions:
  contents: write

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

concurrency:
  group: rondas
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ronda de trabajo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          canales=$(node agentes/canales-activos.mjs)
          for c in $canales; do
            CANAL=$c node agentes/vistas.mjs || true
            CANAL=$c node agentes/ayuda.mjs || true
            CANAL=$c node agentes/funciones.mjs || true
            CANAL=$c node agentes/conciencia.mjs || true
          done
      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add oficina-salida || true
          git diff --cached --quiet || git commit -m "Ronda de trabajo"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
